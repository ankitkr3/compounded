<svg width="960" height="330" viewBox="0 0 960 330" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How compounded works: you correct Claude, compounded notices, asks your approval, remembers the rule, and Claude gets it right next time.">
  <defs>
    <style>
      .t  { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .h  { font-size: 15px; font-weight: 700; fill: #E6EDF3; }
      .s  { font-size: 12px; font-weight: 500; fill: #8B949E; }
      .q  { font-size: 12px; font-weight: 600; fill: #E6EDF3; }
      .num{ font-size: 12px; font-weight: 800; fill: #0F141A; }
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#6E7681"/>
    </marker>
  </defs>

  <!-- canvas card -->
  <rect x="1" y="1" width="958" height="328" rx="16" fill="#0F141A" stroke="#2D333B" stroke-width="2"/>
  <text x="480" y="40" text-anchor="middle" class="t" font-size="18" font-weight="800" fill="#E6EDF3">How compounded learns — in five steps</text>

  <!-- ============ STEP 1: you correct Claude ============ -->
  <g>
    <rect x="28" y="70" width="160" height="190" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="28" y="70" width="160" height="190" rx="12" fill="none" stroke="#D97757" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.02;0.16;0.2;1" dur="10s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <circle cx="48" cy="90" r="11" fill="#D97757"/><text x="48" y="94.5" text-anchor="middle" class="t num">1</text>
    <!-- speech bubble -->
    <rect x="48" y="115" width="120" height="52" rx="10" fill="#21262D" stroke="#30363D"/>
    <path d="M 66 167 L 62 180 L 80 167 Z" fill="#21262D" stroke="#30363D"/>
    <text x="108" y="136" text-anchor="middle" class="t q">“No — search the</text>
    <text x="108" y="152" text-anchor="middle" class="t q">web first!”</text>
    <text x="108" y="215" text-anchor="middle" class="t h">You correct Claude</text>
    <text x="108" y="236" text-anchor="middle" class="t s">like you would correct</text>
    <text x="108" y="251" text-anchor="middle" class="t s">a new employee</text>
  </g>
  <line x1="192" y1="165" x2="212" y2="165" stroke="#6E7681" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============ STEP 2: compounded notices ============ -->
  <g>
    <rect x="216" y="70" width="160" height="190" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="216" y="70" width="160" height="190" rx="12" fill="none" stroke="#D97757" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.22;0.36;0.4;1" dur="10s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <circle cx="236" cy="90" r="11" fill="#D97757"/><text x="236" y="94.5" text-anchor="middle" class="t num">2</text>
    <!-- magnifier -->
    <circle cx="290" cy="138" r="20" fill="none" stroke="#58A6FF" stroke-width="3.5"/>
    <line x1="305" y1="153" x2="318" y2="166" stroke="#58A6FF" stroke-width="4" stroke-linecap="round"/>
    <circle cx="290" cy="138" r="27" fill="none" stroke="#58A6FF" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;0;0.8;0;0" keyTimes="0;0.22;0.28;0.36;1" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="r" values="22;22;32;22;22" keyTimes="0;0.22;0.3;0.36;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <text x="296" y="215" text-anchor="middle" class="t h">compounded notices</text>
    <text x="296" y="236" text-anchor="middle" class="t s">a correction means</text>
    <text x="296" y="251" text-anchor="middle" class="t s">there's a lesson here</text>
  </g>
  <line x1="380" y1="165" x2="400" y2="165" stroke="#6E7681" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============ STEP 3: asks you first ============ -->
  <g>
    <rect x="404" y="70" width="160" height="190" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="404" y="70" width="160" height="190" rx="12" fill="none" stroke="#D97757" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.42;0.56;0.6;1" dur="10s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <circle cx="424" cy="90" r="11" fill="#D97757"/><text x="424" y="94.5" text-anchor="middle" class="t num">3</text>
    <!-- approval dialog -->
    <rect x="420" y="112" width="128" height="62" rx="8" fill="#21262D" stroke="#30363D"/>
    <text x="484" y="132" text-anchor="middle" class="t q">Save this rule?</text>
    <rect x="430" y="142" width="50" height="22" rx="6" fill="#238636"/>
    <text x="455" y="157" text-anchor="middle" class="t" font-size="12" font-weight="700" fill="#FFFFFF">Yes</text>
    <rect x="488" y="142" width="50" height="22" rx="6" fill="#30363D"/>
    <text x="513" y="157" text-anchor="middle" class="t" font-size="12" font-weight="700" fill="#8B949E">No</text>
    <text x="484" y="215" text-anchor="middle" class="t h">It asks you first</text>
    <text x="484" y="236" text-anchor="middle" class="t s">nothing is saved</text>
    <text x="484" y="251" text-anchor="middle" class="t s">without your approval</text>
  </g>
  <line x1="568" y1="165" x2="588" y2="165" stroke="#6E7681" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============ STEP 4: rule remembered ============ -->
  <g>
    <rect x="592" y="70" width="160" height="190" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="592" y="70" width="160" height="190" rx="12" fill="none" stroke="#D97757" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.62;0.76;0.8;1" dur="10s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <circle cx="612" cy="90" r="11" fill="#D97757"/><text x="612" y="94.5" text-anchor="middle" class="t num">4</text>
    <!-- bookmark + check -->
    <path d="M 654 112 h 36 v 56 l -18 -12 l -18 12 z" fill="#BC8CFF" opacity="0.9"/>
    <path d="M 661 132 l 8 8 l 14 -16" stroke="#0F141A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="672" y="215" text-anchor="middle" class="t h">Rule remembered</text>
    <text x="672" y="236" text-anchor="middle" class="t s">“when asked for latest →</text>
    <text x="672" y="251" text-anchor="middle" class="t s">search the web first”</text>
  </g>
  <line x1="756" y1="165" x2="776" y2="165" stroke="#6E7681" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============ STEP 5: next time, done right ============ -->
  <g>
    <rect x="780" y="70" width="160" height="190" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5"/>
    <rect x="780" y="70" width="160" height="190" rx="12" fill="none" stroke="#3FB950" stroke-width="2.5" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8;0.82;0.96;1" dur="10s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <circle cx="800" cy="90" r="11" fill="#3FB950"/><text x="800" y="94.5" text-anchor="middle" class="t num">5</text>
    <!-- big check -->
    <circle cx="860" cy="140" r="26" fill="none" stroke="#3FB950" stroke-width="3.5"/>
    <path d="M 847 140 l 9 10 l 18 -20" stroke="#3FB950" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="860" cy="140" r="26" fill="none" stroke="#3FB950" stroke-width="1.5" opacity="0">
      <animate attributeName="opacity" values="0;0;0.8;0;0" keyTimes="0;0.82;0.88;0.96;1" dur="10s" repeatCount="indefinite"/>
      <animate attributeName="r" values="28;28;38;28;28" keyTimes="0;0.82;0.9;0.96;1" dur="10s" repeatCount="indefinite"/>
    </circle>
    <text x="860" y="215" text-anchor="middle" class="t h">Next time: done right</text>
    <text x="860" y="236" text-anchor="middle" class="t s">no re-explaining —</text>
    <text x="860" y="251" text-anchor="middle" class="t s">it just remembers</text>
  </g>

  <!-- footer line -->
  <text x="480" y="300" text-anchor="middle" class="t s" font-size="13">The more it proves itself, the more freedom it earns. One mistake, and it loses a level — just like trust in real life.</text>
</svg>
