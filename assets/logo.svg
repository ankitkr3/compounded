<svg width="560" height="150" viewBox="0 0 560 150" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="compounded — skills that earn trust, and compound">
  <!-- card -->
  <rect x="1" y="1" width="558" height="148" rx="16" fill="#0F141A" stroke="#2D333B" stroke-width="2"/>

  <!-- ===== icon: four trust-tier bars + compound growth curve ===== -->
  <!-- baseline -->
  <line x1="26" y1="112" x2="134" y2="112" stroke="#2D333B" stroke-width="2" stroke-linecap="round"/>

  <!-- .proposed -->
  <rect x="30" y="84" width="18" height="28" rx="3" fill="#6E7681">
    <animate attributeName="height" from="0" to="28" dur="0.5s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    <animate attributeName="y" from="112" to="84" dur="0.5s" begin="0.2s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <!-- .verified -->
  <rect x="54" y="68" width="18" height="44" rx="3" fill="#58A6FF">
    <animate attributeName="height" from="0" to="44" dur="0.5s" begin="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    <animate attributeName="y" from="112" to="68" dur="0.5s" begin="0.45s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <!-- .trusted -->
  <rect x="78" y="50" width="18" height="62" rx="3" fill="#BC8CFF">
    <animate attributeName="height" from="0" to="62" dur="0.5s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    <animate attributeName="y" from="112" to="50" dur="0.5s" begin="0.7s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </rect>
  <!-- .autonomous -->
  <rect x="102" y="30" width="18" height="82" rx="3" fill="#3FB950">
    <animate attributeName="height" from="0" to="82" dur="0.5s" begin="0.95s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    <animate attributeName="y" from="112" to="30" dur="0.5s" begin="0.95s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
    <animate attributeName="opacity" values="1;0.75;1" dur="2.4s" begin="2s" repeatCount="indefinite"/>
  </rect>

  <!-- compound curve over the bar tops -->
  <path id="growth" d="M 39 80 C 63 68, 87 52, 113 26" stroke="#D97757" stroke-width="3" stroke-linecap="round" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" from="100" to="0" dur="0.9s" begin="1.3s" fill="freeze" calcMode="spline" keySplines="0.2 0.8 0.2 1"/>
  </path>

  <!-- pulse riding the curve, forever -->
  <circle r="4.5" fill="#D97757" opacity="0">
    <animateMotion dur="2.4s" begin="2.4s" repeatCount="indefinite" path="M 39 80 C 63 68, 87 52, 113 26"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.8;1" dur="2.4s" begin="2.4s" repeatCount="indefinite"/>
  </circle>
  <!-- spark at the summit -->
  <circle cx="113" cy="26" r="6" fill="none" stroke="#D97757" stroke-width="2" opacity="0">
    <animate attributeName="opacity" values="0;0.9;0" dur="2.4s" begin="2.4s" repeatCount="indefinite"/>
    <animate attributeName="r" values="4;9;4" dur="2.4s" begin="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- ===== wordmark ===== -->
  <text x="162" y="82" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-1" fill="#E6EDF3">compounded</text>
  <text x="164" y="110" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#8B949E">skills that earn trust — and compound</text>
</svg>
